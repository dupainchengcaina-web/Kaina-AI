<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinn AI</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060608;
            color: #FFFFFF;
            min-height: 100vh;
        }

        .app-header {
            padding: 18px 16px;
            background: #0D0D11;
            border-bottom: 1px solid #1C1C24;
            display: flex;
            justify-content: space-between;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #8B5CF6;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .screen-content {
            padding: 16px 16px 90px 16px;
            display: none;
        }
        .screen-content.active {
            display: block !important;
        }

        /* DISCOVER FEED */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .char-card {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .char-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: #16161F;
        }
        .char-card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .char-card-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .char-card-tagline {
            font-size: 12px;
            color: #8E8E9F;
            margin-bottom: 12px;
        }
        .char-card-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        /* CREATION FIELDS */
        .creation-sheet {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #8E8E9F;
        }
        .input-group input, .input-group textarea {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        /* FIXED NAV TRAY */
        .bottom-nav-tray {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0D0D11;
            border-top: 1px solid #1C1C24;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #62627A;
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            width: 33%;
        }
        .nav-item.active {
            color: #8B5CF6;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>Quinn AI</h1>
    </div>

    <!-- TAB 1: DISCOVER SCREEN -->
    <div id="discover-screen" class="screen-content active">
        <div class="character-grid">
            <div class="char-card">
                <img src="https://unsplash.com" alt="Avatar">
                <div class="char-card-info">
                    <div class="char-card-name">Georgie</div>
                    <div class="char-card-tagline">Your custom unfiltered AI companion.</div>
                    <button class="char-card-btn" onclick="showPage('chats-screen')">Initialize Chat</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 2: CREATE SCREEN -->
    <div id="create-screen" class="screen-content">
        <div class="creation-sheet">
            <div class="input-group">
                <label>Character Name</label>
                <input type="text" placeholder="Matrix name...">
            </div>
            <div class="input-group">
                <label>Tagline</label>
                <input type="text" placeholder="Short description...">
            </div>
            <div class="input-group">
                <label>Personality Core</label>
                <textarea placeholder="Behavior instructions..."></textarea>
            </div>
            <button class="char-card-btn" style="padding:14px; font-size:15px;">Compile Character Profile</button>
        </div>
    </div>

    <!-- TAB 3: CHATS SCREEN -->
    <div id="chats-screen" class="screen-content">
        <div style="background: #111116; padding: 16px; border-radius: 12px; margin-bottom: 12px;">
            <p style="color:#8E8E9F; font-size:14px; margin-bottom:8px;">Georgie</p>
            <p>Hey there! Welcome to Quinn AI. Your parameters are entirely open.</p>
        </div>
        <div style="display:flex; gap:8px;">
            <input type="text" placeholder="Type a message..." style="flex:1; background:#111116; border:1px solid #1C1C24; padding:12px; border-radius:24px; color:white; outline:none;">
            <button style="background:#8B5CF6; border:none; width:44px; height:44px; border-radius:50%; color:white;">➔</button>
        </div>
    </div>

    <!-- NAVIGATION TRAY -->
    <div class="bottom-nav-tray">
        <div class="nav-item active" id="tab-disc" onclick="showPage('discover-screen', 'tab-disc')">
            <span class="nav-icon">🪐</span>
            <span>Discover</span>
        </div>
        <div class="nav-item" id="tab-cre" onclick="showPage('create-screen', 'tab-cre')">
            <span class="nav-icon">🔮</span>
            <span>Create</span>
        </div>
        <div class="nav-item" id="tab-cha" onclick="showPage('chats-screen', 'tab-cha')">
            <span class="nav-icon">💜</span>
            <span>Chats</span>
        </div>
    </div>

    <script>
        // Simplified, error-proof page router
        function showPage(screenId, tabId) {
            // Hide all pages manually
            document.getElementById('discover-screen').classList.remove('active');
            document.getElementById('create-screen').classList.remove('active');
            document.getElementById('chats-screen').classList.remove('active');

            // Deactivate all button colors
            document.getElementById('tab-disc').classList.remove('active');
            document.getElementById('tab-cre').classList.remove('active');
            document.getElementById('tab-cha').classList.remove('active');

            // Turn on the selected elements
            document.getElementById(screenId).classList.add('active');
            if(tabId) {
                document.getElementById(tabId).classList.add('active');
            } else {
                document.getElementById('tab-cha').classList.add('active');
            }
        }
    </script>
</body>
</html>
