<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinn AI</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060608;
            color: #FFFFFF;
            min-height: 100vh;
        }

        /* PREMIUM VIOLET BRAND HEADER PANEL */
        .app-header {
            padding: 18px 16px;
            background: #0D0D11;
            border-bottom: 1px solid #1C1C24;
            display: flex;
            justify-content: space-between;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #8B5CF6;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .screen-content {
            padding: 16px 16px 90px 16px;
            display: none;
        }
        .screen-content.active {
            display: block !important;
        }

        /* FIXED BOTTOM NAVIGATION TRAY PLACEHOLDER */
        .bottom-nav-tray {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0D0D11;
            border-top: 1px solid #1C1C24;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #62627A;
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            width: 33%;
        }
        .nav-item.active {
            color: #8B5CF6;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- BRAND TOP BAR -->
    <div class="app-header">
        <h1>Quinn AI</h1>
    </div>

    <!-- MAIN APP ACTIVE CANVAS AREA -->
    <div id="discover-screen" class="screen-content active">
        <div style="text-align: center; margin-top: 40px; color: #8E8E9F;">
            <p style="font-size: 18px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;">Base Frame Loaded!</p>
            <p>Your header and nav rules are running perfectly.</p>
        </div>
    </div>

    <!-- BOTTOM ACTION NAVIGATION CONTROLS -->
    <div class="bottom-nav-tray">
        <div class="nav-item active">
            <span class="nav-icon">🪐</span>
            <span>Discover</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🔮</span>
            <span>Create</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">💜</span>
            <span>Chats</span>
        </div>
    </div>

</body>
</html>
