<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinnjam</title>
    <!-- Google Fonts: Inter for that premium, clean mobile typography look -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0B0B0B;
            color: #FFFFFF;
            overflow-x: hidden;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        /* --- THE SIGNATURE HANGJAM PROGRESS BAR CHIP --- */
        .top-gradient-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            display: flex;
            z-index: 1000;
        }
        .bar-pink { background: #FF2A7A; width: 50%; }
        .bar-cyan { background: #00F0FF; width: 50%; }

        /* HEADER PANEL */
        .app-header {
            padding: 20px 16px 10px 16px;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* SCREEN CANVAS LAYER */
        .screen-content {
            padding: 10px 16px 90px 16px;
            display: none;
        }
        .screen-content.active {
            display: block;
        }

        /* --- VIEW 1: HOME FEED CARD GRID --- */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .char-card {
            background: #161618;
            border: 1px solid #242427;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .char-card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            object-fit: cover;
            background-color: #242427;
            margin-bottom: 8px;
        }
        .char-card-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .char-card-tagline {
            font-size: 12px;
            color: #9A9A9A;
            line-height: 1.3;
            margin-bottom: 10px;
        }
        .char-card-btn {
            background: #4A72FF;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }

        /* --- VIEW 2: IMMERSIVE NOVEL CHAT CHANNELS --- */
        #chat-screen {
            padding: 0 0 140px 0;
        }
        .chat-header {
            padding: 15px 16px;
            border-bottom: 1px solid #1F1F22;
            display: flex;
            align-items: center;
            background: rgba(11, 11, 11, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 4px;
            z-index: 10;
        }
        .chat-header-name {
            font-size: 18px;
            font-weight: 600;
        }
        .chat-messages-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg-bubble {
            max-width: 85%;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }
        .msg-assistant {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-user {
            background: #4A72FF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        /* CHAT INPUT AREA FRAME */
        .chat-input-area {
            position: fixed;
            bottom: 65px;
            left: 0;
            width: 100%;
            background: #0B0B0B;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 99;
        }
        .chat-input-box {
            flex: 1;
            background: #161618;
            border: 1px solid #242427;
            border-radius: 24px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .chat-send-btn {
            background: #4A72FF;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* --- VIEW 3: UNLIMITED CREATION DASHBOARD SHEET --- */
        .creation-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: 500;
            color: #9A9A9A;
        }
        .input-group input, .input-group textarea, .input-group select {
            background: #161618;
            border: 1px solid #242427;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .input-group textarea {
            resize: none;
            height: 100px;
        }
        
        /* STYLE CHIP OPTIONS SELECTION */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .style-chip {
            background: #161618;
            border: 1px solid #242427;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .style-chip.selected {
            border-color: #00F0FF;
            background: rgba(0, 240, 255, 0.05);
        }

        .submit-btn {
            background: #4A72FF;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }

        /* --- NATIVE HANGJAM BOTTOM NAV BAR TRAY --- */
        .bottom-nav-tray {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #121214;
            border-top: 1px solid #1F1F22;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #7A7A7A;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            width: 33%;
            height: 100%;
            justify-content: center;
        }
        .nav-item.active {
            color: #00F0FF;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="top-gradient-bar"><div class="bar-pink"></div><div class="bar-cyan"></div></div>

    <!-- MAIN BOTTOM NAV TRAY -->
    <div class="bottom-nav-tray">
        <div id="nav-home" class="nav-item active" onclick="switchTab('home-screen', 'nav-home')">
            <div class="nav-icon">🏠</div>
            <div>Discover</div>
        </div>
        <div id="nav-creator" class="nav-item" onclick="switchTab('creator-screen', 'nav-creator')">
            <div class="nav-icon">➕</div>
            <div>Create</div>
        </div>
        <div id="nav-chat" class="nav-item" onclick="switchTab('chat-screen', 'nav-chat')">
            <div class="nav-icon">💬</div>
            <div>Chats</div>
        </div>
    </div>

    <!-- VIEW 1: HOME DASHBOARD FEED -->
    <div id="home-screen" class="screen-content active">
        <div class="app-header">
            <h1>Quinnjam</h1>
        </div>
        <div class="character-grid" id="roster-grid"></div>
    </div>

    <!-- VIEW 2: IMMERSIVE CHAT BOARD -->
    <div id="chat-screen" class="screen-content">
        <div class="chat-header">
            <div class="chat-header-name" id="active-chat-title">Select a character</div>
        </div>
        <div class="chat-messages-container" id="chat-box-stream">
            <div class="msg-bubble msg-assistant">Welcome to Quinnjam. Tap the Create icon below to launch your first character card or open an ongoing session!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input-box" id="typing-line" placeholder="Continue the story...">
            <button class="chat-send-btn" onclick="sendMessage()">»</button>
        </div>
    </div>

    <!-- VIEW 3: UNLIMITED CREATION DASHBOARD STUDIO -->
    <div id="creator-screen" class="screen-content">
        <div class="app-header">
            <h1>Create Character</h1>
        </div>
