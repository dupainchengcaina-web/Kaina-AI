<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinn AI</title>
    <!-- Google Fonts: Inter for that premium, clean cyber-typography look -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060608;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- SEA SOUL VIOLET BRAND HEADER --- */
        .app-header {
            padding: 18px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0D0D11;
            border-bottom: 1px solid #1C1C24;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #8B5CF6; /* Premium Sea Soul Violet Accent */
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* SCREEN FRAME CONTAINER LAYER */
        .screen-content {
            padding: 16px 16px 90px 16px;
            display: none; /* Controlled explicitly via JS */
        }
        .screen-content.active {
            display: block !important;
        }

        /* --- TAB 1: DISCOVER (SEA SOUL STRUCTURED CARDS) --- */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 4px;
        }
        .char-card {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .char-card-img-wrapper {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            background-color: #16161F;
        }
        .char-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .char-card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .char-card-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #FFFFFF;
        }
        .char-card-tagline {
            font-size: 12px;
            color: #8E8E9F;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .char-card-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }

        /* --- TAB 2: UNFILTERED CREATION SHEET --- */
        .creation-sheet {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-row-twin {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #8E8E9F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input, .input-group textarea {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #8B5CF6;
            background: #13131A;
        }
        .input-group textarea {
            resize: none;
            height: 90px;
        }
        
        /* UNRESTRICTED CHIP CHANNELS */
        .philosophy-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .style-chip {
            background: #111116;
            border: 1px solid #1C1C24;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #8E8E9F;
            cursor: pointer;
        }
        .style-chip.selected {
            border-color: #8B5CF6;
            color: #FFFFFF;
            background: rgba(139, 92, 246, 0.15);
        }

        /* DUAL MEDIA FILE UPLOADS */
        .file-upload-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .custom-file-btn {
            background: #111116;
            border: 1px dashed #2C2C3A;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #8E8E9F;
        }
        .custom-file-btn.loaded {
            border-color: #8B5CF6;
            color: #8B5CF6;
            background: rgba(139, 92, 246, 0.05);
        }

        .submit-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* --- TAB 3: IMMERSIVE CHATS SCREEN FRAME --- */
        #chats-screen {
            padding: 0;
            position: fixed;
            top: 61px; /* Aligns smoothly right below header */
            bottom: 65px; /* Aligns smoothly above nav bar */
            left: 0;
            width: 100%;
            display: none;
        }
        .chat-window {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #060608;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .chat-wallpaper-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 6, 8, 0.88); /* Ensures clean text readability over wallpapers */
            z-index: 1;
        }
        .chat-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(13, 13, 17, 0.85);
            backdrop-filter: blur(15px);
            z-index: 2;
        }
        .chat-header-name {
            font-size: 17px;
            font-weight: 700;
            color: #FFFFFF;
        }
        .chat-messages-container {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            z-index: 2;
        }
        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap; /* Infinite text formatting container */
        }
        .msg-assistant {
            background: rgba(22, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.04);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #E4E4E7;
        }
        .msg-user {
            background: #8B5CF6;
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .chat-input-area {
            background: #0D0D11;
            border-top: 1px solid #1C1C24;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 2;
        }
        .chat-input-box {
            flex: 1;
            background: #16161F;
            border: 1px solid #2C2C3A;
            border-radius: 24px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .chat-input-box:focus {
            border-color: #8B5CF6;
        }
        .chat-send-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        /* --- FIXED BOTTOM NAVIGATION TRAY --- */
        .bottom-nav-tray {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0D0D11;
            border-top: 1px solid #1C1C24;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500;
        }
