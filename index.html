<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quinn AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Google Fonts: Inter typography matrix -->
  <link href="https://googleapis.com" rel="stylesheet">
  
  <!-- BACKGROUND PIPELINE INTERFACE LOADER LINK -->
  <script src="utils.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #060608;
      color: #FFFFFF;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- PREMIUM SEA SOUL VIOLET BRAND HEADER --- */
    #header {
      padding: 18px 16px;
      background: #0D0D11;
      border-bottom: 1px solid #1C1C24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    #header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #8B5CF6; /* Premium Quinn Violet Accent */
      text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
      letter-spacing: -0.5px;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
    }

    /* --- IMMERSIVE DIALOGUE HISTORY MATRIX --- */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 95px; /* Smooth padding gap rule */
    }
    .message {
      max-width: 85%;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap; /* Supports unlimited text walls formatting */
    }
    .user {
      background-color: #8B5CF6;
      color: #FFFFFF;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
    }
    .character {
      background-color: rgba(22, 22, 28, 0.95);
      border: 1px solid #1C1C24;
      color: #E4E4E7;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* --- ACTIVE WRITING CHANNEL INPUT BAR --- */
    #input-area {
      padding: 14px 16px;
      background-color: #0D0D11;
      border-top: 1px solid #1C1C24;
      display: flex;
      gap: 10px;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 100;
    }
    #message-input {
      flex: 1;
      background: #16161F;
      border: 1px solid #2C2C3A;
      border-radius: 24px;
      padding: 12px 18px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    #message-input:focus {
      border-color: #8B5CF6;
    }
    
    /* SYSTEM ACTION ICONS BUTTONS */
    .action-btn {
      background: #8B5CF6;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
    .header-icon-btn {
      background: none;
      border: none;
      color: #8B5CF6;
      font-size: 22px;
      cursor: pointer;
    }

    /* --- CUSTOM UNRESTRICTED DASHBOARD PARAMETER SWITCHES --- */
    .unfiltered-parameters-panel {
      background: #111116;
      border: 1px solid #1C1C24;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .param-label {
      font-size: 12px;
      font-weight: 700;
      color: #8E8E9F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .toggle-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .rule-chip {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid #8B5CF6;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="container">
    
    <!-- BRAND CONTROLS HEADER BAR -->
    <div id="header">
      <button class="header-icon-btn" id="menu-trigger">&#9776;</button>
      <h1>Quinn AI</h1>
      <button class="header-icon-btn" id="config-trigger">&#9881;</button>
    </div>

    <!-- MAIN DIALOGUE MONITOR WINDOW -->
    <div id="chat-history">
      
      <!-- UNRESTRICTED RULES PARAMETERS CONFIGURATION NOTICE COMPONENT -->
      <div class="unfiltered-parameters-panel">
        <span class="param-label">Active Structural Parameters (No Filters)</span>
        <div class="toggle-row">
          <div class="rule-chip">Unfiltered</div>
          <div class="rule-chip">Unrestricted</div>
          <div class="rule-chip">NSFW Allowed</div>
        </div>
      </div>

      <!-- INJECTED DIALOGUE CHANNELS CANVAS LOAD ZONE -->
      <div class="message character">Hey there! Welcome to your new Quinn AI matrix canvas dashboard. Your core parameters are loaded entirely out of the local open-source codebase wrapper with no text limits or filters. Who are we creating today?</div>
    </div>

    <!-- OPERATIONAL WRITING CHANNEL TRAY -->
    <div id="input-area">
      <input type="text" id="message-input" placeholder="Type a completely unrestricted response...">
      <button class="action-btn" id="send-trigger">➔</button>
    </div>

  </div>

</body>
</html>
