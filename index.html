<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinn AI</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060608;
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SEA SOUL VIOLET BRAND HEADER PANEL --- */
        .app-header {
            padding: 18px 16px;
            background: #0D0D11;
            border-bottom: 1px solid #1C1C24;
            display: flex;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #8B5CF6;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* MASTER TARGET HOVER VIEWS */
        .screen-content {
            padding: 16px 16px 90px 16px;
        }

        /* --- TAB 1: DISCOVER SCREEN (PREMIUM GRID CARDS) --- */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 4px;
        }
        .char-card {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .char-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: #16161F;
        }
        .char-card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .char-card-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #FFFFFF;
        }
        .char-card-tagline {
            font-size: 12px;
            color: #8E8E9F;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .char-card-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        /* --- TAB 2: UNFILTERED CREATION SHEET --- */
        .creation-sheet {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #8E8E9F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input, .input-group textarea {
            background: #111116;
            border: 1px solid #1C1C24;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .input-group textarea {
            resize: none;
            height: 90px;
        }

        /* PREMIUM DUAL PHOTO GALLERY PICKER BUTTONS */
        .file-upload-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 4px;
        }
        .custom-file-btn {
            background: #111116;
            border: 1px dashed #2C2C3A;
            padding: 14px 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #8E8E9F;
        }

        .submit-btn {
            background: #8B5CF6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        /* --- FIXED FIXED BOTTOM NAVIGATION TRAY --- */
        .bottom-nav-tray {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0D0D11;
            border-top: 1px solid #1C1C24;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #62627A;
            font-size: 11px;
            font-weight: 600;
            gap: 4px;
            width: 33%;
            height: 100%;
            justify-content: center;
        }
        .nav-item.active {
            color: #8B5CF6;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- APP HEAD TOP PANEL -->
    <div class="app-header">
        <h1>Quinn AI</h1>
    </div>

    <!-- MAIN VIEWBOX SECTION FRAME -->
    <div id="app-viewbox" class="screen-content">
        
        <!-- INSIDE DISCOVER (DEFAULT CONTENT BLOCK) -->
        <div id="content-discover">
            <div class="character-grid">
                <div class="char-card">
                    <img src="https://unsplash.com" alt="Avatar">
                    <div class="char-card-info">
                        <div class="char-card-name">Georgie</div>
                        <div class="char-card-tagline">Your primary completely open assistant companion matrix.</div>
                        <button class="char-card-btn" onclick="document.getElementById('content-discover').style.display='none'; document.getElementById('content-create').style.display='none'; document.getElementById('content-chats').style.display='block'; document.getElementById('tab-disc').classList.remove('active'); document.getElementById('tab-cre').classList.remove('active'); document.getElementById('tab-cha').classList.add('active');">Initialize Chat</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- INSIDE CREATE (HIDDEN AT START) -->
        <div id="content-create" style="display: none;">
            <div class="creation-sheet">
                <div class="input-group">
                    <label>Character Name</label>
                    <input type="text" placeholder="Matrix first name...">
                </div>
                <div class="input-group">
                    <label>Tagline</label>
                    <input type="text" placeholder="Short description summary...">
                </div>
                <div class="input-group">
                    <label>Media Assets (Android Gallery Link)</label>
                    <div class="file-upload-wrapper">
                        <div class="custom-file-btn" onclick="alert('Android Gallery triggered for Avatar profile upload.')">+ Card Avatar</div>
                        <div class="custom-file-btn" onclick="alert('Android Gallery triggered for Wallpaper Background upload.')">+ Chat Background</div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Personality Core Architecture</label>
                    <textarea placeholder="Unrestricted behavioral settings guidelines..."></textarea>
                </div>
                <button class="submit-btn" onclick="alert('Compiling custom matrix assets...'); document.getElementById('content-create').style.display='none'; document.getElementById('content-discover').style.display='block'; document.getElementById('tab-cre').classList.remove('active'); document.getElementById('tab-disc').classList.add('active');">Compile Character Profile</button>
            </div>
        </div>

        <!-- INSIDE CHATS (HIDDEN AT START) -->
        <div id="content-chats" style="display: none;">
            <div style="background: #111116; padding: 16px; border-radius: 16px; border: 1px solid #1C1C24; margin-bottom: 14px;">
                <p style="color:#8B5CF6; font-size:13px; font-weight:700; text-transform:uppercase; margin-bottom:6px; letter-spacing:0.5px;">Georgie</p>
                <p style="line-height:1.5; color:#E4E4E7;">Hey there! Welcome to Quinn AI. Your parameters are entirely open. Let's build your unrestricted character engine.</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="text" style="flex: 1; background: #111116; border: 1px solid #1C1C24; padding: 12px 16px; border-radius: 24px; color: white; outline: none; font-size: 15px;" placeholder="Type an explicit, unrestricted message response...">
                <button style="background: #8B5CF6; border: none; width: 44px; height: 44px; border-radius: 50%; color: white; font-size: 16px;" onclick="alert('Message string logged directly into unrestricted phone storage matrix.')">➔</button>
            </div>
        </div>

    </div>

    <!-- BOTTOM ACTION NAVIGATION CONTROLS (DIRECT ONCLICK EMBEDDED RULES) -->
    <div class="bottom-nav-tray">
